<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Escape Room - EST. 1849</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #instructions {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;

            background: rgba(0,0,0,0.75);
            color: white;

            padding: 12px 20px;
            border-radius: 10px;

            text-align: center;
            font-size: 16px;

            pointer-events: none;
        }
    </style>
</head>

<body>

<div id="instructions">
    🥽 Find the hidden code.<br>
    Look at the gold from the correct angle.
</div>

<a-scene
    background="color: #68798b"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: true">

    <!-- ================================================= -->
    <!-- LIGHTING -->
    <!-- ================================================= -->

    <a-entity light="type: ambient; intensity: 0.65; color: #ffffff">
    </a-entity>

    <a-entity
        light="type: directional; intensity: 1.4"
        position="0 6 2">
    </a-entity>

    <!-- ================================================= -->
    <!-- PLAYER -->
    <!-- ================================================= -->

    <a-entity id="player"
              position="0 1.6 4">

        <a-camera
            look-controls="pointerLockEnabled: true"
            wasd-controls="enabled: true">
        </a-camera>

        <!-- VR controllers -->
        <a-entity
            laser-controls="hand: left"
            raycaster="objects: .clickable">
        </a-entity>

        <a-entity
            laser-controls="hand: right"
            raycaster="objects: .clickable">
        </a-entity>

    </a-entity>


    <!-- ================================================= -->
    <!-- ROOM -->
    <!-- ================================================= -->

    <!-- Floor -->
    <a-plane
        rotation="-90 0 0"
        width="18"
        height="18"
        color="#d7d9dc"
        material="roughness: 0.9">
    </a-plane>

    <!-- Back wall -->
    <a-box
        position="0 4 -4"
        width="18"
        height="8"
        depth="0.3"
        color="#718295">
    </a-box>

    <!-- Left wall -->
    <a-box
        position="-9 4 0"
        width="0.3"
        height="8"
        depth="18"
        color="#718295">
    </a-box>

    <!-- Right wall -->
    <a-box
        position="9 4 0"
        width="0.3"
        height="8"
        depth="18"
        color="#718295">
    </a-box>

    <!-- Ceiling -->
    <a-box
        position="0 8 0"
        width="18"
        height="0.3"
        depth="18"
        color="#68798b">
    </a-box>


    <!-- ================================================= -->
    <!-- FLOOR TEXT -->
    <!-- ================================================= -->

    <a-text
        value="EST. 1849"
        position="0 0.015 2.5"
        rotation="-90 0 0"
        align="center"
        width="5"
        color="#3c4652"
        side="double">
    </a-text>


    <!-- ================================================= -->
    <!-- VAULT -->
    <!-- ================================================= -->

    <!-- Vault body -->
    <a-box
        id="vault"
        position="0 3 -3.65"
        width="4.5"
        height="5"
        depth="0.7"
        color="#596574"
        material="roughness: 0.7">
    </a-box>

    <!-- Vault door -->
    <a-cylinder
        position="0 3 -4.05"
        rotation="90 0 0"
        radius="1.65"
        height="0.25"
        color="#46515e">
    </a-cylinder>

    <!-- Inner circle -->
    <a-cylinder
        position="0 3 -4.20"
        rotation="90 0 0"
        radius="1.35"
        height="0.27"
        color="#27313d">
    </a-cylinder>

    <!-- ================================================= -->
    <!-- VAULT WHEEL -->
    <!-- ================================================= -->

    <a-torus
        position="0 3 -4.38"
        rotation="90 0 0"
        radius="0.75"
        radius-tubular="0.08"
        color="#82909e">
    </a-torus>

    <a-cylinder
        position="0 3 -4.42"
        rotation="90 0 0"
        radius="0.15"
        height="0.1"
        color="#aab4be">
    </a-cylinder>

    <!-- Wheel spokes -->

    <a-box
        position="0 3 -4.48"
        width="1.6"
        height="0.08"
        depth="0.08"
        color="#91a0ad">
    </a-box>

    <a-box
        position="0 3 -4.48"
        width="0.08"
        height="1.6"
        depth="0.08"
        color="#91a0ad">
    </a-box>


    <!-- ================================================= -->
    <!-- KEYPAD -->
    <!-- ================================================= -->

    <a-box
        position="2.1 2.3 -4.45"
        width="1.25"
        height="1.8"
        depth="0.15"
        color="#20262d">
    </a-box>

    <!-- Screen -->

    <a-plane
        position="2.1 2.85 -4.55"
        width="0.9"
        height="0.35"
        color="#111111">
    </a-plane>

    <a-text
        id="display"
        value="ENTER CODE"
        position="2.1 2.85 -4.62"
        align="center"
        width="1.7"
        color="#00ff88">
    </a-text>


    <!-- ================================================= -->
    <!-- KEYPAD BUTTONS -->
    <!-- ================================================= -->

    <!-- 7 -->
    <a-box class="clickable keypad"
           data-number="7"
           position="1.78 2.42 -4.57"
           width="0.3"
           height="0.3"
           depth="0.08"
           color="#4b5560">
        <a-text value="7"
                position="0 0 -0.06"
                align="center"
                width="1.5"
                color="white">
        </a-text>
    </a-box>

    <!-- 8 -->
    <a-box class="clickable keypad"
           data-number="8"
           position="2.1 2.42 -4.57"
           width="0.3"
           height="0.3"
           depth="0.08"
           color="#4b5560">
        <a-text value="8"
                position="0 0 -0.06"
                align="center"
                width="1.5"
                color="white">
        </a-text>
    </a-box>

    <!-- 9 -->
    <a-box class="clickable keypad"
           data-number="9"
           position="2.42 2.42 -4.57"
           width="0.3"
           height="0.3"
           depth="0.08"
           color="#4b5560">
        <a-text value="9"
                position="0 0 -0.06"
                align="center"
                width="1.5"
                color="white">
        </a-text>
    </a-box>

    <!-- 4 -->
    <a-box class="clickable keypad"
           data-number="4"
           position="1.78 2.05 -4.57"
           width="0.3"
           height="0.3"
           depth="0.08"
           color="#4b5560">
        <a-text value="4"
                position="0 0 -0.06"
                align="center"
                width="1.5"
                color="white">
        </a-text>
    </a-box>

    <!-- 5 -->
    <a-box class="clickable keypad"
           data-number="5"
           position="2.1 2.05 -4.57"
           width="0.3"
           height="0.3"
           depth="0.08"
           color="#4b5560">
        <a-text value="5"
                position="0 0 -0.06"
                align="center"
                width="1.5"
                color="white">
        </a-text>
    </a-box>

    <!-- 6 -->
    <a-box class="clickable keypad"
           data-number="6"
           position="2.42 2.05 -4.57"
           width="0.3"
           height="0.3"
           depth="0.08"
           color="#4b5560">
        <a-text value="6"
                position="0 0 -0.06"
                align="center"
                width="1.5"
                color="white">
        </a-text>
    </a-box>

    <!-- 3 -->
    <a-box class="clickable keypad"
           data-number="3"
           position="2.42 1.68 -4.57"
           width="0.3"
           height="0.3"
           depth="0.08"
           color="#4b5560">
        <a-text value="3"
                position="0 0 -0.06"
                align="center"
                width="1.5"
                color="white">
        </a-text>
    </a-box>

    <!-- ENTER -->
    <a-box class="clickable"
           id="enterButton"
           position="2.1 1.68 -4.57"
           width="0.3"
           height="0.3"
           depth="0.08"
           color="#287a4d">

        <a-text
            value="OK"
            position="0 0 -0.06"
            align="center"
            width="1.5"
            color="white">
        </a-text>

    </a-box>


    <!-- ================================================= -->
    <!-- LEFT SHELVES -->
    <!-- ================================================= -->

    <a-box
        position="-5 3 -1"
        width="0.25"
        height="6"
        depth="5"
        color="#4b5968">
    </a-box>

    <a-box
        position="-1.8 3 -1"
        width="0.25"
        height="6"
        depth="5"
        color="#4b5968">
    </a-box>

    <a-box
        position="-3.4 5.8 -1"
        width="3.4"
        height="0.2"
        depth="5"
        color="#4b5968">
    </a-box>

    <a-box
        position="-3.4 4 -1"
        width="3.4"
        height="0.2"
        depth="5"
        color="#4b5968">
    </a-box>

    <a-box
        position="-3.4 2.2 -1"
        width="3.4"
        height="0.2"
        depth="5"
        color="#4b5968">
    </a-box>


    <!-- ================================================= -->
    <!-- RIGHT SHELVES -->
    <!-- ================================================= -->

    <a-box
        position="5 3 -1"
        width="0.25"
        height="6"
        depth="5"
        color="#4b5968">
    </a-box>

    <a-box
        position="1.8 3 -1"
        width="0.25"
        height="6"
        depth="5"
        color="#4b5968">
    </a-box>

    <a-box
        position="3.4 5.8 -1"
        width="3.4"
        height="0.2"
        depth="5"
        color="#4b5968">
    </a-box>

    <a-box
        position="3.4 4 -1"
        width="3.4"
        height="0.2"
        depth="5"
        color="#4b5968">
    </a-box>

    <a-box
        position="3.4 2.2 -1"
        width="3.4"
        height="0.2"
        depth="5"
        color="#4b5968">
    </a-box>


    <!-- ================================================= -->
    <!-- MONEY + GOLD -->
    <!-- ================================================= -->

    <a-entity id="moneyShelves"></a-entity>


    <!-- ================================================= -->
    <!-- THE SECRET 743 -->
    <!-- ================================================= -->

    <!--
        These gold blocks are deliberately arranged so that
        from the correct position/angle they visually form:

                       743

        The player has to move around the room to discover it.
    -->

    <a-entity id="secretCode">

        <!-- 7 -->

        <a-box position="-3.7 5.25 -0.55"
               width="0.22"
               height="0.22"
               depth="0.5"
               color="#d9a800">
        </a-box>

        <a-box position="-3.45 5.0 -0.55"
               width="0.22"
               height="0.22"
               depth="0.5"
               color="#d9a800">
        </a-box>

        <a-box position="-3.2 4.75 -0.55"
               width="0.22"
               height="0.22"
               depth="0.5"
               color="#d9a800">
        </a-box>

        <!-- 4 -->

        <a-box position="-2.55 4.95 -0.55"
               width="0.22"
               height="0.22"
               depth="0.5"
               color="#d9a800">
        </a-box>

        <a-box position="-2.55 5.2 -0.55"
               width="0.22"
               height="0.22"
               depth="0.5"
               color="#d9a800">
        </a-box>

        <a-box position="-2.3 5.0 -0.55"
               width="0.22"
               height="0.22"
               depth="0.5"
               color="#d9a800">
        </a-box>

        <!-- 3 -->

        <a-box position="-1.55 5.2 -0.55"
               width="0.5"
               height="0.22"
               depth="0.5"
               color="#d9a800">
        </a-box>

        <a-box position="-1.55 4.95 -0.55"
               width="0.5"
               height="0.22"
               depth="0.5"
               color="#d9a800">
        </a-box>

        <a-box position="-1.55 4.7 -0.55"
               width="0.5"
               height="0.22"
               depth="0.5"
               color="#d9a800">
        </a-box>

    </a-entity>


    <!-- ================================================= -->
    <!-- COMPLETION MESSAGE -->
    <!-- ================================================= -->

    <a-text
        id="winMessage"
        value="VAULT OPENED!  ESCAPE COMPLETE!"
        position="0 6.5 -3.5"
        align="center"
        width="7"
        color="#00ff88"
        visible="false">
    </a-text>


    <!-- ================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================================= -->

    <script>

        let enteredCode = "";

        const display =
            document.querySelector("#display");

        const enterButton =
            document.querySelector("#enterButton");

        const winMessage =
            document.querySelector("#winMessage");

        /*
        ----------------------------------------
        KEYPAD
        ----------------------------------------
        */

        document.querySelectorAll(".keypad")
            .forEach(button => {

                button.addEventListener("click", () => {

                    const number =
                        button.getAttribute("data-number");

                    if (enteredCode.length < 3) {

                        enteredCode += number;

                        display.setAttribute(
                            "value",
                            enteredCode
                        );

                    }

                });

            });


        /*
        ----------------------------------------
        ENTER CODE
        ----------------------------------------
        */

        enterButton.addEventListener("click", () => {

            if (enteredCode === "743") {

                display.setAttribute(
                    "value",
                    "ACCESS GRANTED"
                );

                winMessage.setAttribute(
                    "visible",
                    "true"
                );

                /*
                Open vault door
                */

                const vaultDoor =
                    document.querySelector(
                        "#vault"
                    );

                vaultDoor.setAttribute(
                    "animation",
                    "property: position; to: 0 7 -3.65; dur: 2500; easing: easeOutQuad"
                );

                document.querySelector(
                    "#instructions"
                ).innerHTML =
                    "🔓 ACCESS GRANTED — ESCAPE COMPLETE!";

            }

            else {

                display.setAttribute(
                    "value",
                    "WRONG CODE"
                );

                enteredCode = "";

                setTimeout(() => {

                    display.setAttribute(
                        "value",
                        "ENTER CODE"
                    );

                }, 1200);

            }

        });


        /*
        ----------------------------------------
        RANDOM MONEY/GOLD
        ----------------------------------------
        */

        const shelf =
            document.querySelector(
                "#moneyShelves"
            );

        /*
        Create lots of green money blocks
        and gold bars.
        */

        for (let side of [-1, 1]) {

            for (let row = 0; row < 3; row++) {

                for (let i = 0; i < 14; i++) {

                    const x =
                        side * (2.05 + Math.random() * 2.4);

                    const y =
                        2.5 + row * 1.6 +
                        Math.random() * 0.6;

                    const z =
                        -2.7 + Math.random() * 3.5;

                    const money =
                        document.createElement("a-box");

                    money.setAttribute(
                        "position",
                        `${x} ${y} ${z}`
                    );

                    money.setAttribute(
                        "width",
                        "0.65"
                    );

                    money.setAttribute(
                        "height",
                        "0.18"
                    );

                    money.setAttribute(
                        "depth",
                        "0.5"
                    );

                    money.setAttribute(
                        "color",
                        "#087f3b"
                    );

                    shelf.appendChild(money);

                }


                /*
                Gold bars
                */

                for (let i = 0; i < 12; i++) {

                    const x =
                        side * (2.05 + Math.random() * 2.4);

                    const y =
                        2.65 + row * 1.6;

                    const z =
                        -2.5 + Math.random() * 3;

                    const gold =
                        document.createElement("a-box");

                    gold.setAttribute(
                        "position",
                        `${x} ${y} ${z}`
                    );

                    gold.setAttribute(
                        "width",
                        "0.38"
                    );

                    gold.setAttribute(
                        "height",
                        "0.18"
                    );

                    gold.setAttribute(
                        "depth",
                        "0.55"
                    );

                    gold.setAttribute(
                        "color",
                        "#d8a900"
                    );

                    gold.setAttribute(
                        "rotation",
                        `0 ${Math.random() * 30 - 15} 0`
                    );

                    shelf.appendChild(gold);

                }

            }

        }


        /*
        ----------------------------------------
        KEYBOARD SUPPORT
        ----------------------------------------
        */

        window.addEventListener("keydown", (event) => {

            if (
                event.key >= "0" &&
                event.key <= "9"
            ) {

                if (enteredCode.length < 3) {

                    enteredCode += event.key;

                    display.setAttribute(
                        "value",
                        enteredCode
                    );

                }

            }

            if (event.key === "Enter") {

                enterButton.click();

            }

        });

    </script>

</a-scene>

</body>
</html>

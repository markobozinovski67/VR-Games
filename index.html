<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EST. 1849 - VR Escape Room</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#message {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.8);
    color: white;
    padding: 14px 25px;
    border-radius: 12px;
    z-index: 20;
    text-align: center;
    font-size: 18px;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="message">
    Find the hidden code...
</div>

<a-scene
    background="color:#718296"
    renderer="colorManagement:true; physicallyCorrectLights:true"
    vr-mode-ui="enabled:true">

<!-- =====================================================
     LIGHTING
===================================================== -->

<a-entity light="type:ambient; intensity:0.7"></a-entity>

<a-entity
    light="type:directional; intensity:1.5"
    position="0 8 2">
</a-entity>

<a-entity
    light="type:point; intensity:1.5; distance:25"
    position="0 6 0">
</a-entity>


<!-- =====================================================
     PLAYER
===================================================== -->

<a-entity id="player" position="0 1.6 3">

    <a-camera
        look-controls
        wasd-controls="acceleration:15">
    </a-camera>

    <a-entity
        laser-controls="hand:left"
        raycaster="objects:.clickable; far:20">
    </a-entity>

    <a-entity
        laser-controls="hand:right"
        raycaster="objects:.clickable; far:20">
    </a-entity>

</a-entity>


<!-- =====================================================
     ROOM
===================================================== -->

<!-- FLOOR -->

<a-plane
    rotation="-90 0 0"
    width="20"
    height="20"
    color="#d9dadd">
</a-plane>


<!-- BACK WALL -->

<a-box
    position="0 4 -7"
    width="20"
    height="8"
    depth=".3"
    color="#718296">
</a-box>


<!-- LEFT WALL -->

<a-box
    position="-10 4 0"
    width=".3"
    height="8"
    depth="20"
    color="#718296">
</a-box>


<!-- RIGHT WALL -->

<a-box
    position="10 4 0"
    width=".3"
    height="8"
    depth="20"
    color="#718296">
</a-box>


<!-- CEILING -->

<a-box
    position="0 8 0"
    width="20"
    height=".3"
    depth="20"
    color="#657589">
</a-box>


<!-- =====================================================
     FLOOR DESIGN
===================================================== -->

<a-ring
    position="0 .02 1"
    rotation="-90 0 0"
    radius-inner="3"
    radius-outer="3.1"
    color="#68717b">
</a-ring>

<a-ring
    position="0 .025 1"
    rotation="-90 0 0"
    radius-inner="1.8"
    radius-outer="1.9"
    color="#68717b">
</a-ring>


<!-- EST 1849 -->

<a-text
    value="EST. 1849"
    position="0 .04 1.8"
    rotation="-90 0 0"
    align="center"
    width="5"
    color="#414951">
</a-text>


<!-- =====================================================
     MONEY / GOLD SHELVES
===================================================== -->

<a-entity id="leftShelves"></a-entity>
<a-entity id="rightShelves"></a-entity>


<!-- =====================================================
     SECRET GOLD CODE WALL
===================================================== -->

<a-text
    value="THE GOLD HIDES THE CODE"
    position="0 6.8 -6.82"
    align="center"
    width="6"
    color="#dfe4e8">
</a-text>


<!-- dark backing -->

<a-box
    position="0 3.7 -6.85"
    width="7"
    height="5.5"
    depth=".15"
    color="#566474">
</a-box>


<!-- =====================================================
     GOLD 743
     The bars are deliberately raised and angled.
     They form 743 when viewed from the clue position.
===================================================== -->

<a-entity id="goldCode">

    <!-- 7 -->

    <a-box
        position="-2.35 5.2 -6.98"
        width="1.25"
        height=".20"
        depth=".30"
        rotation="0 15 0"
        color="#d9a514">
    </a-box>

    <a-box
        position="-1.85 4.35 -6.98"
        width=".20"
        height="1.55"
        depth=".30"
        rotation="0 -5 0"
        color="#d9a514">
    </a-box>

    <a-box
        position="-2.35 3.5 -6.98"
        width="1.25"
        height=".20"
        depth=".30"
        rotation="0 -15 0"
        color="#d9a514">
    </a-box>


    <!-- 4 -->

    <a-box
        position="-0.65 4.25 -7"
        width=".20"
        height="1.8"
        depth=".30"
        rotation="0 8 0"
        color="#d9a514">
    </a-box>

    <a-box
        position="-0.15 3.85 -7"
        width="1.1"
        height=".20"
        depth=".30"
        color="#d9a514">
    </a-box>

    <a-box
        position=".35 4.45 -7"
        width=".20"
        height="1.2"
        depth=".30"
        rotation="0 -8 0"
        color="#d9a514">
    </a-box>


    <!-- 3 -->

    <a-box
        position="1.35 5.2 -6.98"
        width="1.25"
        height=".20"
        depth=".30"
        color="#d9a514">
    </a-box>

    <a-box
        position="1.85 4.35 -6.98"
        width=".20"
        height="1.55"
        depth=".30"
        rotation="0 8 0"
        color="#d9a514">
    </a-box>

    <a-box
        position="1.35 3.5 -6.98"
        width="1.25"
        height=".20"
        depth=".30"
        color="#d9a514">
    </a-box>

</a-entity>


<!-- =====================================================
     CLUE POSITION
===================================================== -->

<a-cylinder
    id="clueSpot"
    position="-4.2 .04 -1.2"
    radius=".35"
    height=".03"
    color="#d5a91c"
    opacity=".25">
</a-cylinder>

<a-text
    value="STAND HERE"
    position="-4.2 .08 -1.2"
    rotation="-90 0 0"
    align="center"
    width="1.4"
    color="#8b721d">
</a-text>


<!-- =====================================================
     LOCKER WALL
===================================================== -->

<a-text
    value="SECURE ARCHIVES"
    position="0 7.25 -6.65"
    align="center"
    width="7"
    color="#e2e5e8">
</a-text>

<a-entity id="lockerWall"></a-entity>


<!-- =====================================================
     KEYPAD
===================================================== -->

<a-entity id="keypad" visible="false">

    <!-- keypad body -->

    <a-box
        position="0 2.7 -6.45"
        width="2.7"
        height="3.3"
        depth=".25"
        color="#20262d">
    </a-box>


    <!-- screen -->

    <a-plane
        position="0 3.85 -6.59"
        width="2"
        height=".5"
        color="#101418">
    </a-plane>

    <a-text
        id="screen"
        value="ENTER CODE"
        position="0 3.85 -6.67"
        align="center"
        width="3.5"
        color="#00ff85">
    </a-text>


    <!-- 7 -->

    <a-box
        class="clickable keypad"
        data-number="7"
        position="-.7 3.2 -6.62"
        width=".5"
        height=".5"
        depth=".12"
        color="#59636d">

        <a-text value="7"
            position="0 0 -.08"
            align="center"
            width="2"
            color="white">
        </a-text>
    </a-box>


    <!-- 8 -->

    <a-box
        class="clickable keypad"
        data-number="8"
        position="0 3.2 -6.62"
        width=".5"
        height=".5"
        depth=".12"
        color="#59636d">

        <a-text value="8"
            position="0 0 -.08"
            align="center"
            width="2"
            color="white">
        </a-text>
    </a-box>


    <!-- 9 -->

    <a-box
        class="clickable keypad"
        data-number="9"
        position=".7 3.2 -6.62"
        width=".5"
        height=".5"
        depth=".12"
        color="#59636d">

        <a-text value="9"
            position="0 0 -.08"
            align="center"
            width="2"
            color="white">
        </a-text>
    </a-box>


    <!-- 4 -->

    <a-box
        class="clickable keypad"
        data-number="4"
        position="-.7 2.55 -6.62"
        width=".5"
        height=".5"
        depth=".12"
        color="#59636d">

        <a-text value="4"
            position="0 0 -.08"
            align="center"
            width="2"
            color="white">
        </a-text>
    </a-box>


    <!-- 5 -->

    <a-box
        class="clickable keypad"
        data-number="5"
        position="0 2.55 -6.62"
        width=".5"
        height=".5"
        depth=".12"
        color="#59636d">

        <a-text value="5"
            position="0 0 -.08"
            align="center"
            width="2"
            color="white">
        </a-text>
    </a-box>


    <!-- 6 -->

    <a-box
        class="clickable keypad"
        data-number="6"
        position=".7 2.55 -6.62"
        width=".5"
        height=".5"
        depth=".12"
        color="#59636d">

        <a-text value="6"
            position="0 0 -.08"
            align="center"
            width="2"
            color="white">
        </a-text>
    </a-box>


    <!-- 1 -->

    <a-box
        class="clickable keypad"
        data-number="1"
        position="-.7 1.9 -6.62"
        width=".5"
        height=".5"
        depth=".12"
        color="#59636d">

        <a-text value="1"
            position="0 0 -.08"
            align="center"
            width="2"
            color="white">
        </a-text>
    </a-box>


    <!-- 2 -->

    <a-box
        class="clickable keypad"
        data-number="2"
        position="0 1.9 -6.62"
        width=".5"
        height=".5"
        depth=".12"
        color="#59636d">

        <a-text value="2"
            position="0 0 -.08"
            align="center"
            width="2"
            color="white">
        </a-text>
    </a-box>


    <!-- 3 -->

    <a-box
        class="clickable keypad"
        data-number="3"
        position=".7 1.9 -6.62"
        width=".5"
        height=".5"
        depth=".12"
        color="#59636d">

        <a-text value="3"
            position="0 0 -.08"
            align="center"
            width="2"
            color="white">
        </a-text>
    </a-box>


    <!-- ENTER -->

    <a-box
        id="enterButton"
        class="clickable"
        position="0 1.25 -6.62"
        width="1.6"
        height=".5"
        depth=".12"
        color="#277b4d">

        <a-text
            value="ENTER"
            position="0 0 -.08"
            align="center"
            width="2"
            color="white">
        </a-text>

    </a-box>

</a-entity>


<!-- =====================================================
     KEY
===================================================== -->

<a-entity
    id="key"
    visible="false"
    class="clickable"
    position="0 2.4 -5.9">

    <a-cylinder
        radius=".13"
        height=".65"
        rotation="0 0 90"
        color="#e4bd37">
    </a-cylinder>

    <a-torus
        position="-.35 0 0"
        rotation="90 0 0"
        radius=".22"
        radius-tubular=".07"
        color="#e4bd37">
    </a-torus>

    <a-box
        position=".35 0 0"
        width=".18"
        height=".3"
        depth=".12"
        color="#e4bd37">
    </a-box>

</a-entity>


<!-- =====================================================
     EXIT DOOR
===================================================== -->

<a-box
    position="0 3 -9.6"
    width="4.5"
    height="6.2"
    depth=".5"
    color="#3d4854">
</a-box>

<a-box
    id="exitDoor"
    class="clickable"
    position="0 3 -9.3"
    width="3.5"
    height="5.5"
    depth=".35"
    color="#27313a">
</a-box>

<a-text
    value="EXIT"
    position="0 4.6 -9.55"
    align="center"
    width="3"
    color="#ff5555">
</a-text>

<a-text
    id="escapeText"
    value="ESCAPE COMPLETE!"
    position="0 6.7 -8"
    align="center"
    width="8"
    color="#00ff80"
    visible="false">
</a-text>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

const message = document.getElementById("message");
const lockerWall = document.getElementById("lockerWall");
const keypad = document.getElementById("keypad");
const screen = document.getElementById("screen");
const key = document.getElementById("key");
const exitDoor = document.getElementById("exitDoor");
const escapeText = document.getElementById("escapeText");

let selectedLocker = null;
let enteredCode = "";
let hasKey = false;
let clueFound = false;


/* =====================================================
   CREATE SHELVES
===================================================== */

function createShelf(side) {

    const entity =
        document.getElementById(
            side === -1
            ? "leftShelves"
            : "rightShelves"
        );

    const x = side * 5.5;

    /* vertical supports */

    for (let i = 0; i < 4; i++) {

        const support =
            document.createElement("a-box");

        support.setAttribute(
            "position",
            `${x + side * (i * 1.45 - 2.1)} 3 -1.8`
        );

        support.setAttribute(
            "width",".18"
        );

        support.setAttribute(
            "height","6"
        );

        support.setAttribute(
            "depth","4.5"
        );

        support.setAttribute(
            "color","#566474"
        );

        entity.appendChild(support);
    }


    /* shelf levels */

    for (let row = 0; row < 4; row++) {

        const shelf =
            document.createElement("a-box");

        shelf.setAttribute(
            "position",
            `${x} ${1.2 + row * 1.55} -1.8`
        );

        shelf.setAttribute(
            "width","3.8"
        );

        shelf.setAttribute(
            "height",".15"
        );

        shelf.setAttribute(
            "depth","4.5"
        );

        shelf.setAttribute(
            "color","#596776"
        );

        entity.appendChild(shelf);


        /* money and gold */

        for (let i = 0; i < 13; i++) {

            const item =
                document.createElement("a-box");

            const isGold =
                i % 3 !== 0;

            item.setAttribute(
                "position",
                `${x + side * (Math.random()*1.4-0.7)}
                 ${1.45 + row*1.55 + Math.random()*.3}
                 ${-3.5 + Math.random()*3.3}`
            );

            item.setAttribute(
                "width",
                isGold ? ".45" : ".7"
            );

            item.setAttribute(
                "height",
                isGold ? ".22" : ".16"
            );

            item.setAttribute(
                "depth",
                isGold ? ".65" : ".5"
            );

            item.setAttribute(
                "color",
                isGold ? "#d7a814" : "#087b3b"
            );

            entity.appendChild(item);
        }
    }
}

createShelf(-1);
createShelf(1);


/* =====================================================
   CREATE LOCKERS
===================================================== */

const years = [
    1814,1815,1816,1817,1818,1819,1820,1821,
    1829,1830,1831,1832,1833,1834,1835,1836,
    1844,1845,1846,1847,1848,1849,1850,1851,
    1859,1860,1861,1862,1863,1864,1865,1866,
    1874,1875,1876,1877,1878,1879,1880,1881
];

const columns = 8;

years.forEach((year,index) => {

    const row =
        Math.floor(index / columns);

    const column =
        index % columns;

    const x =
        (column - 3.5) * 2.2;

    const y =
        6.5 - row * 1.35;


    /* locker */

    const locker =
        document.createElement("a-box");

    locker.classList.add("clickable");

    locker.setAttribute(
        "position",
        `${x} ${y} -6.45`
    );

    locker.setAttribute(
        "width","2.02"
    );

    locker.setAttribute(
        "height","1.15"
    );

    locker.setAttribute(
        "depth",".35"
    );

    locker.setAttribute(
        "color",
        year === 1849
        ? "#707e8b"
        : "#647280"
    );

    locker.setAttribute(
        "data-year",
        year
    );


    /* year */

    const label =
        document.createElement("a-text");

    label.setAttribute(
        "value",
        year === 1849
        ? "EST. 1849"
        : String(year)
    );

    label.setAttribute(
        "position",
        "0 .22 -.21"
    );

    label.setAttribute(
        "align","center"
    );

    label.setAttribute(
        "width","2"
    );

    label.setAttribute(
        "color",
        year === 1849
        ? "#ffe078"
        : "#e7eaed"
    );

    locker.appendChild(label);


    /* handle */

    const handle =
        document.createElement("a-box");

    handle.setAttribute(
        "position",
        "0 -.25 -.23"
    );

    handle.setAttribute(
        "width",".32"
    );

    handle.setAttribute(
        "height",".08"
    );

    handle.setAttribute(
        "depth",".08"
    );

    handle.setAttribute(
        "color","#252c33"
    );

    locker.appendChild(handle);

    lockerWall.appendChild(locker);
});


/* =====================================================
   LOCKER CLICK
===================================================== */

setTimeout(() => {

    document
        .querySelectorAll("[data-year]")
        .forEach(locker => {

            locker.addEventListener("click", () => {

                const year =
                    locker.getAttribute("data-year");


                if (year === "1849") {

                    selectedLocker = locker;

                    keypad.setAttribute(
                        "visible","true"
                    );

                    enteredCode = "";

                    screen.setAttribute(
                        "value",
                        "ENTER CODE"
                    );

                    message.innerHTML =
                        "EST. 1849 — ENTER THE 3 DIGIT CODE";

                } else {

                    message.innerHTML =
                        "🔒 This locker is locked.";

                }

            });

        });

},500);


/* =====================================================
   KEYPAD
===================================================== */

document
    .querySelectorAll(".keypad")
    .forEach(button => {

        button.addEventListener("click", () => {

            const number =
                button.getAttribute("data-number");

            if (enteredCode.length < 3) {

                enteredCode += number;

                screen.setAttribute(
                    "value",
                    enteredCode
                );

            }

        });

    });


/* =====================================================
   ENTER 743
===================================================== */

document
    .getElementById("enterButton")
    .addEventListener("click", () => {

        if (enteredCode === "743") {

            screen.setAttribute(
                "value",
                "ACCESS GRANTED"
            );

            message.innerHTML =
                "🔓 1849 OPENED — TAKE THE KEY!";


            keypad.setAttribute(
                "visible",
                "false"
            );


            /* locker opens */

            if (selectedLocker) {

                selectedLocker.setAttribute(
                    "animation",
                    "property:rotation; to:0 90 0; dur:1200; easing:easeOutQuad"
                );

            }


            /* key appears */

            key.setAttribute(
                "visible",
                "true"
            );

            key.setAttribute(
                "position",
                "0 2.5 -5.7"
            );

        } else {

            screen.setAttribute(
                "value",
                "WRONG CODE"
            );

            enteredCode = "";

            setTimeout(() => {

                screen.setAttribute(
                    "value",
                    "ENTER CODE"
                );

            },1000);

        }

    });


/* =====================================================
   KEY PICKUP
===================================================== */

key.addEventListener("click", () => {

    if (
        key.getAttribute("visible")
        === "true"
    ) {

        hasKey = true;

        key.setAttribute(
            "visible",
            "false"
        );

        message.innerHTML =
            "🔑 KEY COLLECTED — GO TO THE EXIT!";

    }

});


/* =====================================================
   EXIT
===================================================== */

exitDoor.addEventListener("click", () => {

    if (hasKey) {

        message.innerHTML =
            "🚪 THE EXIT IS OPEN! YOU ESCAPED!";

        escapeText.setAttribute(
            "visible",
            "true"
        );

        exitDoor.setAttribute(
            "animation",
            "property:position; to:0 7 -9.3; dur:2000; easing:easeInOutQuad"
        );

    } else {

        message.innerHTML =
            "🔒 LOCKED — YOU NEED THE KEY.";

    }

});


/* =====================================================
   FIND THE GOLD CLUE
===================================================== */

const player =
    document.getElementById("player");

const clueSpot =
    document.getElementById("clueSpot");

setInterval(() => {

    const p =
        player.object3D.position;

    const distance =
        Math.sqrt(
            Math.pow(p.x + 4.2,2) +
            Math.pow(p.z + 1.2,2)
        );


    /*
    When player gets close to the clue position,
    the gold becomes brighter and the message appears.
    */

    if (distance < 1.2 && !clueFound) {

        clueFound = true;

        message.innerHTML =
            "👀 YOU FOUND THE ANGLE — THE GOLD READS 743!";

        clueSpot.setAttribute(
            "color",
            "#ffe45c"
        );

        document
            .getElementById("goldCode")
            .setAttribute(
                "scale",
                "1.08 1.08 1.08"
            );

    }

},200);


/* =====================================================
   COMPUTER TESTING
===================================================== */

window.addEventListener("keydown", event => {

    if (
        event.key >= "0" &&
        event.key <= "9"
    ) {

        if (enteredCode.length < 3) {

            enteredCode += event.key;

            screen.setAttribute(
                "value",
                enteredCode
            );

        }

    }

    if (event.key === "Enter") {

        document
            .getElementById("enterButton")
            .click();

    }

});

</script>

</a-scene>

</body>
</html>

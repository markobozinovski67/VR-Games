<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EST. 1849 - VR Escape Room</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #info {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;

        padding: 14px 25px;
        border-radius: 12px;

        background: rgba(0,0,0,0.75);
        color: white;

        text-align: center;
        font-size: 17px;

        pointer-events: none;
    }
</style>
</head>

<body>

<div id="info">
    Find the hidden number...
</div>


<a-scene
    background="color: #65778a"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: true">

<!-- ====================================================== -->
<!-- LIGHTING -->
<!-- ====================================================== -->

<a-entity
    light="type: ambient; intensity: 0.65"
    position="0 5 0">
</a-entity>

<a-entity
    light="type: directional; intensity: 1.4"
    position="0 8 4">
</a-entity>

<a-entity
    light="type: point; intensity: 1.5; distance: 20"
    position="0 6 0">
</a-entity>


<!-- ====================================================== -->
<!-- PLAYER -->
<!-- ====================================================== -->

<a-entity id="player" position="0 1.6 3">

    <a-camera
        look-controls="pointerLockEnabled: true"
        wasd-controls="enabled: true">
    </a-camera>

    <!-- LEFT VR CONTROLLER -->
    <a-entity
        laser-controls="hand: left"
        raycaster="objects: .clickable; far: 20">
    </a-entity>

    <!-- RIGHT VR CONTROLLER -->
    <a-entity
        laser-controls="hand: right"
        raycaster="objects: .clickable; far: 20">
    </a-entity>

</a-entity>


<!-- ====================================================== -->
<!-- ROOM -->
<!-- ====================================================== -->

<!-- FLOOR -->

    rotation="-90 0 0"
    width="20"
    height="20"
    color="#d5d7da">
</a-plane>

    position="0 4 -6"

    height="8"
    depth="0.3"
    color="#687a8d">
</a-box>


<!-- LEFT WALL -->

<!-- RIGHT WALL -->

    <!-- BUTTON 5 -->

    <!-- BUTTON 6 -->

    <a-box

        <a-text

    visible="false"

    position="0 2 -4.5">

    <a-box
        width="0.18"

    </a-box>

    position="0 3 -9.7"
    width="4"
    height="6"

</a-box>

    value="EXIT"

    width="3"

    id="keyhole"
    position="0 2.8 -9.75"

    position="0 6.5 -5"
    align="center"
    width="8"
    color="#00ff88"
    visible="false">

<!-- ====================================================== -->
<!-- JAVASCRIPT -->
<!-- ====================================================== -->

<script>

let selectedLocker = null;

let enteredCode = "";

let hasKey = false;

let escaped = false;


const info =
    document.querySelector("#info");

const lockers =
    document.querySelector("#lockers");

const keypad =
    document.querySelector("#keypad");

const screen =
    document.querySelector("#screen");

const key =
    document.querySelector("#key");

const exitDoor =
    document.querySelector("#exitDoor");

const win =
    document.querySelector("#win");


/* ======================================================
   CREATE LOCKERS
====================================================== */

const years = [

1814,1815,1816,1817,1818,1819,1820,1821,
1829,1830,1831,1832,1833,1834,1835,1836,
1844,1845,1846,1847,1848,1849,1850,1851,
1859,1860,1861,1862,1863,1864,1865,1866,
1874,1875,1876,1877,1878,1879,1880,1881,
1889,1890,1891,1892,1893,1894,1895,1896

];


const columns = 8;

const lockerWidth = 2.15;

const lockerHeight = 1.35;


/*
Create the lockers on the back wall.
*/

years.forEach((year, index) => {

    const row =
        Math.floor(index / columns);

    const column =
        index % columns;


    const x =
        (column - 3.5) * lockerWidth;

    const y =
        6.1 - row * 1.55;


    /*
    Locker body
    */

    const locker =
        document.createElement("a-box");

    locker.setAttribute(
        "position",
        `${x} ${y} -5.55`
    );

    locker.setAttribute(
        "width",
        "2"
    );

    locker.setAttribute(
        "height",
        lockerHeight
    );

    locker.setAttribute(
        "depth",
        "0.35"
    );

    locker.setAttribute(
        "color",
        "#647280"
    );


    /*
    Make every locker clickable.
    */

    locker.classList.add("clickable");

    locker.setAttribute(
        "data-year",
        year
    );


    /*
    Year label
    */

    const label =
        document.createElement("a-text");

    label.setAttribute(
        "value",
        year === 1849
            ? "EST. 1849"
            : String(year)
    );

    label.setAttribute(
        "position",
        "0 0.25 -0.2"
    );

    label.setAttribute(
        "align",
        "center"
    );

    label.setAttribute(
        "width",
        "2"
    );

    label.setAttribute(
        "color",
        year === 1849
            ? "#ffe27a"
            : "#e1e6eb"
    );


    locker.appendChild(label);


    /*
    Locker handle
    */

    const handle =
        document.createElement("a-box");

    handle.setAttribute(
        "position",
        "0 -0.25 -0.23"
    );

    handle.setAttribute(
        "width",
        "0.35"
    );

    handle.setAttribute(
        "height",
        "0.08"
    );

    handle.setAttribute(
        "depth",
        "0.08"
    );

    handle.setAttribute(
        "color",
        "#252d35"
    );


    locker.appendChild(handle);


    lockers.appendChild(locker);

});


/* ======================================================
   LOCKER INTERACTION
====================================================== */

setTimeout(() => {

    document
        .querySelectorAll("[data-year]")
        .forEach(locker => {

            locker.addEventListener(
                "click",
                () => {

                    const year =
                        locker.getAttribute(
                            "data-year"
                        );


                    /*
                    Only 1849 activates keypad.
                    */

                    if (year === "1849") {

                        selectedLocker =
                            locker;

                        keypad.setAttribute(
                            "visible",
                            "true"
                        );

                        enteredCode = "";

                        screen.setAttribute(
                            "value",
                            "ENTER CODE"
                        );

                        info.innerHTML =
                            "EST. 1849 LOCKER — Find the 3 digit code.";

                    }

                    else {

                        info.innerHTML =
                            "This locker is locked.";

                    }

                }
            );

        });

}, 100);


/* ======================================================
   KEYPAD
====================================================== */

document
    .querySelectorAll(".keypadButton")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const number =
                    button.getAttribute(
                        "data-number"
                    );


                if (enteredCode.length < 3) {

                    enteredCode += number;

                    screen.setAttribute(
                        "value",
                        enteredCode
                    );

                }

            }
        );

    });


/* ======================================================
   ENTER CODE
====================================================== */

document
    .querySelector("#enter")
    .addEventListener(
        "click",
        () => {

            if (enteredCode === "743") {

                screen.setAttribute(
                    "value",
                    "ACCESS GRANTED"
                );


                info.innerHTML =
                    "🔓 LOCKER 1849 OPENED! TAKE THE KEY.";


                /*
                Hide keypad.
                */

                keypad.setAttribute(
                    "visible",
                    "false"
                );


                /*
                Open the 1849 locker.
                */

                if (selectedLocker) {

                    selectedLocker.setAttribute(
                        "animation",
                        "property: rotation; to: 0 90 0; dur: 1200; easing: easeOutQuad"
                    );

                }


                /*
                Spawn key.
                */

                key.setAttribute(
                    "visible",
                    "true"
                );


                key.setAttribute(
                    "position",
                    "0 2.5 -4.8"
                );


                hasKey = false;

            }

            else {

                screen.setAttribute(
                    "value",
                    "WRONG"
                );


                enteredCode = "";


                setTimeout(() => {

                    screen.setAttribute(
                        "value",
                        "ENTER CODE"
                    );

                }, 1000);

            }

        }
    );


/* ======================================================
   PICK UP KEY
====================================================== */

key.addEventListener(
    "click",
    () => {

        if (
            key.getAttribute("visible")
            === "true"
        ) {

            hasKey = true;


            key.setAttribute(
                "visible",
                "false"
            );


            info.innerHTML =
                "🔑 KEY COLLECTED — Find the EXIT.";

        }

    }
);


/* ======================================================
   EXIT DOOR
====================================================== */

exitDoor.classList.add("clickable");


exitDoor.addEventListener(
    "click",
    () => {

        if (hasKey) {

            escaped = true;


            info.innerHTML =
                "🚪 EXIT UNLOCKED! YOU ESCAPED!";


            win.setAttribute(
                "visible",
                "true"
            );


            /*
            Open the exit door.
            */

            exitDoor.setAttribute(
                "animation",
                "property: position; to: 0 6 -9.5; dur: 2000; easing: easeInOutQuad"
            );


        }

        else {

            info.innerHTML =
                "🔒 The door is locked. You need a key.";

        }

    }
);


/* ======================================================
   KEYBOARD TESTING
====================================================== */

window.addEventListener(
    "keydown",
    event => {

        /*
        Number keys work on computer.
        */

        if (
            event.key >= "0" &&
            event.key <= "9"
        ) {

            if (enteredCode.length < 3) {

                enteredCode += event.key;

                screen.setAttribute(
                    "value",
                    enteredCode
                );

            }

        }


        /*
        Enter key submits.
        */

        if (
            event.key === "Enter"
        ) {

            document
                .querySelector("#enter")
                .click();

        }

    }
);

</script>

</a-scene>

</body>
</html>
